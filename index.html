original_code = """<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>City Rail Pumper - Optimized</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#080812;overflow:hidden;font-family:'Georgia',serif;}
#c{width:100vw;height:100vh;display:block;touch-action:none;}
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:12px 18px;pointer-events:none;z-index:10;}
.hp{background:rgba(6,10,22,0.85);border:1px solid rgba(255,200,80,0.3);border-radius:10px;padding:7px 14px;backdrop-filter:blur(10px);}
.hl{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,220,120,0.5);margin-bottom:1px;}
.hv{font-size:18px;font-weight:bold;color:#ffe680;text-shadow:0 0 8px rgba(255,200,80,0.7);}
/* Simple Mobile Controls style */
.mob-btn { display:none; position:fixed; bottom:20px; width:60px; height:60px; background:rgba(255,255,255,0.1); border-radius:50%; justify-content:center; align-items:center; color:white; z-index:100; user-select:none; }
#mob-left { left: 20px; }
#mob-right { left: 90px; }
#mob-pump { right: 20px; bottom: 100px; background:rgba(255,200,80,0.3); }
#mob-fire { right: 20px; bottom: 20px; background:rgba(255,80,80,0.3); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="hp"><div class="hl">Distance</div><div id="dist-v" class="hv">0m</div></div>
  <div class="hp"><div class="hl">Speed</div><div id="speed-v" class="hv">0 km/h</div></div>
</div>

<div id="mob-left" class="mob-btn">L</div>
<div id="mob-right" class="mob-btn">R</div>
<div id="mob-pump" class="mob-btn">P</div>
<div id="mob-fire" class="mob-btn">F</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// --- Optimized Initialization ---
const canvas = document.querySelector('#c');
const renderer = new THREE.WebGLRenderer({
    canvas, 
    antialias: window.devicePixelRatio < 2, // Only antialias on low-res screens
    powerPreference: "high-performance",
    alpha: false 
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Cap pixel ratio for performance
renderer.setSize(window.innerWidth, window.innerHeight);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x080812, 0.002);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0, 5, 10);

// Lights
const ambient = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambient);
const sun = new THREE.DirectionalLight(0xffffff, 1);
sun.position.set(5, 10, 7);
scene.add(sun);

// --- Object Pooling Systems ---
const rocketPool = [];
const activeRockets = [];
const explosionPool = [];
const activeExplosions = [];

function getRocket() {
    let r;
    if (rocketPool.length > 0) {
        r = rocketPool.pop();
        r.visible = true;
    } else {
        const geo = new THREE.CylinderGeometry(0.1, 0.1, 0.5);
        const mat = new THREE.MeshStandardMaterial({color: 0xff4400});
        r = new THREE.Mesh(geo, mat);
        scene.add(r);
    }
    return r;
}

function returnRocket(r) {
    r.visible = false;
    rocketPool.push(r);
    const idx = activeRockets.indexOf(r);
    if(idx > -1) activeRockets.splice(idx, 1);
}

function getExplosion() {
    let e;
    if (explosionPool.length > 0) {
        e = explosionPool.pop();
        e.visible = true;
        e.scale.set(1, 1, 1);
    } else {
        const geo = new THREE.SphereGeometry(1, 8, 8);
        const mat = new THREE.MeshBasicMaterial({color: 0xffff00, transparent: true, opacity: 0.8});
        e = new THREE.Mesh(geo, mat);
        scene.add(e);
    }
    return e;
}

function returnExplosion(e) {
    e.visible = false;
    explosionPool.push(e);
    const idx = activeExplosions.indexOf(e);
    if(idx > -1) activeExplosions.splice(idx, 1);
}

// Game Logic
let gameRunning = true;
let distance = 0;
let speed = 0;

function spawnRocket(pos) {
    const r = getRocket();
    r.position.copy(pos);
    activeRockets.push(r);
}

function spawnExplosion(pos) {
    const e = getExplosion();
    e.position.copy(pos);
    e.userData.life = 1.0;
    activeExplosions.push(e);
}

// Main Loop
const clock = new THREE.Clock();
function loop() {
    requestAnimationFrame(loop);
    const dt = Math.min(clock.getDelta(), 0.05);

    if (gameRunning) {
        // Update Rockets
        for (let i = activeRockets.length - 1; i >= 0; i--) {
            const r = activeRockets[i];
            r.position.z -= 50 * dt;
            if (r.position.z < -100) {
                returnRocket(r);
            }
        }

        // Update Explosions
        for (let i = activeExplosions.length - 1; i >= 0; i--) {
            const e = activeExplosions[i];
            e.userData.life -= dt * 2;
            e.scale.addScalar(dt * 5);
            e.material.opacity = e.userData.life;
            if (e.userData.life <= 0) {
                returnExplosion(e);
            }
        }

        // Update HUD (Throttled or simplified)
        distance += speed * dt;
        document.getElementById('dist-v').innerText = Math.floor(distance) + "m";
    }

    renderer.render(scene, camera);
}

// Touch detection (User original logic preserved)
(function detectTouchDevice(){
  const isTouchDevice=
    ('ontouchstart' in window) ||
    (navigator.maxTouchPoints>0) ||
    window.matchMedia('(pointer:coarse)').matches;
  if(isTouchDevice){
    ['mob-left','mob-right','mob-pump','mob-fire'].forEach(id=>{
      const el=document.getElementById(id);
      if(el) el.style.display='flex';
    });
  }
})();

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

loop();
// Example spawn to show it works
setInterval(() => { if(gameRunning) spawnRocket(new THREE.Vector3(Math.random()*10-5, 0, 50)); }, 1000);
</script>
</body>
</html>
